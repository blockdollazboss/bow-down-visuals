name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "artifacts/bow-down-visuals/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/bow-down-visuals
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform
        run: |
          set -o pipefail
          ls -la dist/public/index.html || echo "NO INDEX.HTML"
          ./node_modules/.bin/cap add android
          test -f android/app/build.gradle || { echo "CAP ADD FAILED - android dir not created"; exit 1; }

      - name: Build debug APK
        working-directory: artifacts/bow-down-visuals/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        working-directory: artifacts/bow-down-visuals/android
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "FIND FOUND NOTHING"
          echo "=== app/build tree ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "NO OUTPUTS DIR"
          echo "=== android dir contents ==="
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bow-down-visuals-apk
          path: artifacts/bow-down-visuals/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
