name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "artifacts/bow-down-visuals/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/bow-down-visuals
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform
        run: |
          ls -la dist/public/index.html || echo "NO INDEX.HTML"
          ./node_modules/.bin/cap add android --verbose 2>&1 | head -50

      - name: Build debug APK
        working-directory: artifacts/bow-down-visuals/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bow-down-visuals-apk
          path: artifacts/bow-down-visuals/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
