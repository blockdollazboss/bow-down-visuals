kind = "web"
previewPath = "/"
title = "Bow Down Visuals"
version = "1.0.0"
id = "artifacts/bow-down-visuals"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19157

[services.development]
run = "pnpm --filter @workspace/bow-down-visuals run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bow-down-visuals", "run", "build" ]
publicDir = "artifacts/bow-down-visuals/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19157"
BASE_PATH = "/"
